name: Gitleaks

# Deterministic in-CI secret scanning. Defense-in-depth on top of GitHub's
# native secret-scanning push protection (which is a repo Settings toggle —
# see SECURITY.md for the recommended admin action).
#
# PR runs scan the compare range (fast); main pushes scan full history.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history needed for push scans and PR compare-range scans.
          fetch-depth: 0
          # Don't bake the token into the cloned .git/config; downstream
          # steps (and Gitleaks itself) don't need it for repo operations.
          persist-credentials: false

      # Use the open-source CLI directly; the official wrapper action requires
      # GITLEAKS_LICENSE for organization-owned repositories.
      - name: Install Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION#v}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${archive}"

          curl --fail --show-error --silent --location "$url" --output "$archive_path"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive_path}" | sha256sum --check --strict

          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "$archive_path" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      - name: Gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          args=(detect --source . --redact --verbose --report-format sarif --report-path gitleaks.sarif)
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            args+=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
          fi

          gitleaks "${args[@]}"
          status=$?
          set -e

          {
            echo "### Gitleaks"
            if [ "$status" -eq 0 ]; then
              echo "No leaks detected."
            else
              echo "Gitleaks reported findings. See the uploaded SARIF artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
